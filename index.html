<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relationship Attention Tracker</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
    <div class="app-container">
        <!-- Login Screen -->
        <div id="login-screen" class="screen active">
            <div class="glass-card">
                <div class="logo">
                    <div class="heart-icon">💛</div>
                    <h1>Attention Tracker</h1>
                </div>
                <p class="subtitle">Track your daily connection quality</p>
                <div id="g_id_onload"
                    data-client_id="YOUR_GOOGLE_CLIENT_ID"
                    data-context="signin"
                    data-ux_mode="popup"
                    data-callback="handleGoogleSignIn"
                    data-auto_prompt="false">
                </div>
                <div class="g_id_signin"
                    data-type="standard"
                    data-shape="pill"
                    data-theme="filled_black"
                    data-text="signin_with"
                    data-size="large"
                    data-logo_alignment="left">
                </div>
            </div>
        </div>

        <!-- Dashboard Screen -->
        <div id="dashboard-screen" class="screen">
            <div class="header">
                <div class="user-info">
                    <img id="user-avatar" src="" alt="User avatar" class="avatar">
                    <span id="user-name"></span>
                </div>
                <button id="logout-btn" class="logout-btn">Logout</button>
            </div>

            <div class="main-content">
                <!-- Rating Section -->
                <div class="glass-card rating-section">
                    <h2>How was your connection today?</h2>
                    
                    <!-- Attention Bar -->
                    <div class="attention-bar">
                        <div class="stars-container">
                            <div class="star" data-value="1" onclick="setRating(1)">
                                <span class="star-icon">⭐</span>
                                <span class="star-label">Unavailable</span>
                            </div>
                            <div class="star" data-value="2" onclick="setRating(2)">
                                <span class="star-icon">⭐</span>
                                <span class="star-label">Distant</span>
                            </div>
                            <div class="star" data-value="3" onclick="setRating(3)">
                                <span class="star-icon">⭐</span>
                                <span class="star-label">Good</span>
                            </div>
                            <div class="star" data-value="4" onclick="setRating(4)">
                                <span class="star-icon">⭐</span>
                                <span class="star-label">Great</span>
                            </div>
                            <div class="star" data-value="5" onclick="setRating(5)">
                                <span class="star-icon">⭐</span>
                                <span class="star-label">Perfect</span>
                            </div>
                        </div>
                        <div class="rating-feedback" id="rating-feedback"></div>
                    </div>

                    <!-- Journal Input -->
                    <div class="journal-section">
                        <label for="comment">Special Comment:</label>
                        <textarea 
                            id="comment" 
                            placeholder="Share your thoughts about today's connection..."
                            rows="4"
                        ></textarea>
                    </div>

                    <!-- Submit Button -->
                    <button id="submit-btn" class="submit-btn" onclick="submitEntry()">
                        Submit Today's Entry
                    </button>

                    <!-- Submission Status -->
                    <div id="submission-status" class="submission-status"></div>
                </div>

                <!-- History Section -->
                <div class="glass-card history-section">
                    <h2>Last 7 Days</h2>
                    <div id="history-list" class="history-list">
                        <div class="empty-history">No entries yet. Submit your first rating!</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
